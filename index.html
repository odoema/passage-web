<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PASSAGE — safe, trusted transportation for children and families.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PASSAGE">

  <!-- Open Graph metadata for WhatsApp and other link previews -->
  <meta property="og:title" content="PASSAGE — Safe Child Transportation">
  <meta property="og:description" content="PASSAGE helps families manage safe, trusted child transportation.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://passagemobility.online/">
  <meta property="og:image" content="https://passagemobility.online/icons/passage_logo.png?v=3">
  <meta property="og:image:secure_url" content="https://passagemobility.online/icons/passage_logo.png?v=3">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="PASSAGE logo">
  <meta property="og:site_name" content="PASSAGE">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PASSAGE — Safe Child Transportation">
  <meta name="twitter:description" content="PASSAGE helps families manage safe, trusted child transportation.">
  <meta name="twitter:image" content="https://passagemobility.online/icons/passage_logo.png?v=3">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>PASSAGE</title>

  <style>
    #passage-install-button {
      display: none;
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 2147483647;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      background: #00BF63;
      color: #fff;
      font: 600 15px/1.2 Arial, sans-serif;
      box-shadow: 0 6px 22px rgba(0,0,0,.22);
      cursor: pointer;
    }
    #passage-install-button.visible { display: block; }
    #passage-install-help {
      display: none;
      position: fixed;
      left: 18px;
      right: 18px;
      bottom: 78px;
      z-index: 2147483647;
      max-width: 430px;
      margin: 0 auto;
      padding: 16px 18px;
      border-radius: 16px;
      background: #fff;
      color: #17202a;
      font: 14px/1.45 Arial, sans-serif;
      box-shadow: 0 8px 30px rgba(0,0,0,.22);
    }
    #passage-install-help.visible { display: block; }
    #passage-install-help strong { display: block; margin-bottom: 6px; }
    #passage-install-close {
      float: right;
      border: 0;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: #667085;
    }
  </style>
</head>
<body>
  <button id="passage-install-button" type="button" aria-label="Install PASSAGE">
    Install PASSAGE
  </button>

  <div id="passage-install-help" role="dialog" aria-live="polite">
    <button id="passage-install-close" type="button" aria-label="Close">×</button>
    <strong>Install PASSAGE</strong>
    <span id="passage-install-text"></span>
  </div>

  <script>
    (function () {
      let deferredPrompt = null;
      const button = document.getElementById('passage-install-button');
      const help = document.getElementById('passage-install-help');
      const helpText = document.getElementById('passage-install-text');
      const close = document.getElementById('passage-install-close');

      const isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      function hideInstallUi() {
        button.classList.remove('visible');
        help.classList.remove('visible');
      }

      if (isStandalone) {
        hideInstallUi();
        return;
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        button.classList.add('visible');
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hideInstallUi();
      });

      button.addEventListener('click', async function () {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const result = await deferredPrompt.userChoice;
          if (result && result.outcome === 'accepted') {
            hideInstallUi();
          }
          deferredPrompt = null;
          return;
        }

        if (isIos) {
          helpText.textContent =
            'On iPhone or iPad, tap Share in Safari, then choose “Add to Home Screen”. PASSAGE will then open like an app.';
          help.classList.add('visible');
          return;
        }

        helpText.textContent =
          'Use your browser menu and choose “Install app” or “Add to Home screen” to install PASSAGE on this device.';
        help.classList.add('visible');
      });

      close.addEventListener('click', function () {
        help.classList.remove('visible');
      });

      if (new URLSearchParams(window.location.search).get('install') === '1') {
        setTimeout(function () {
          button.classList.add('visible');
        }, 1200);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
